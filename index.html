<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجم مقاييس اللغة - ابن فارس</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .dictionary-content {
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            line-height: 2.2;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- App Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-800 mb-2">معجم مقاييس اللغة</h1>
            <p class="text-slate-600 text-sm">لابن فارس (ت 395 هـ)</p>
        </header>
      
        <!-- Devolope's  Name -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="w-full text-center">
                <h1 dir="ltr" class="text-2xl font-bold text-slate-700">
                    Developed By Miadad Haque
                </h1>
                
                 <p class="text-slate-600 text-sm">
                    ادخل الجذر العربي مثلا: كبت، دخل
                </p>
            </div>
        </div>


        <!-- Search Box Section -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="اكتب الجذر المطابق تماماً (مثال: كتب، علم، خرج)..." 
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 text-lg"
                >
                <button 
                    onclick="searchRoot()" 
                    class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-xl font-semibold transition"
                >
                    بحث
                </button>
            </div>
        </div>

        <!-- Result Display Section -->
        <div id="resultContainer" class="space-y-6">
            <div class="text-center py-12 text-slate-400">
                أدخل الجذر المراد البحث عنه لعرض مادته المطابقة تماماً.
            </div>
        </div>
    </div>

    <!-- JavaScript for Exact Root Matching -->
    <script>
        let dictionaryData = [];

        // JSON ফাইল লোড করার ফাংশন
        async function loadDictionaryData() {
            try {
                const response = await fetch('maqayees_parsed.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                dictionaryData = await response.json();
                console.log("تم تحميل المعجم بنجاح:", dictionaryData.length, "جذر");
            } catch (error) {
                console.error("خطأ في تحميل بيانات المعجم:", error);
                document.getElementById('resultContainer').innerHTML = `
                    <div class="text-center py-8 text-rose-600 font-semibold">
                        خطأ: تعذر تحميل ملف البيانات (maqayees_parsed.json). تأكد من وجود الملف في مجلد www.
                    </div>`;
            }
        }

        // অদৃশ্য ক্যারেক্টার ও হরকত পরিষ্কার করার হেল্পার ফাংশন
        function cleanText(text) {
            if (!text) return "";
            return text
                .replace(/[\u200c\u200b\u200d\u20fe\ufeff]/g, "") // অদৃশ্য ক্যারেক্টার রিমুভ
                .replace(/[\u064b-\u065f\u0670]/g, "")           // হরকত, শাদ্দা, খাড়া যবর/আলিফ রিমুভ
                .replace(/\s+/g, " ")
                .trim();
        }

        // শুধুমাত্র হুবহু রুট মেলানোর সার্চ লজিক
        function searchRoot() {
            const rawQuery = document.getElementById('searchInput').value;
            const query = cleanText(rawQuery);
            const container = document.getElementById('resultContainer');

            if (!query) {
                container.innerHTML = `<div class="text-center py-8 text-amber-600">الرجاء إدخال جذر صحيح للبحث.</div>`;
                return;
            }

            const results = dictionaryData.filter(item => {
                if (!item || typeof item.root !== "string") return false;
                return cleanText(item.root) === query;
            });

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-rose-600 bg-white p-6 rounded-2xl border border-slate-200">
                        عذراً، لم يُعثر على جذر مطابق تماماً لـ: <span class="font-bold">"${rawQuery}"</span>
                    </div>`;
                return;
            }

            container.innerHTML = results.map(item => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-4">
                    <div class="border-b border-slate-100 pb-3 mb-4 flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-emerald-700">${item.root}</h2>
                        <span class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold">جذر رقم ${item.id}</span>
                    </div>
                    <div class="dictionary-content text-slate-700 space-y-4">
                        ${item.content}
                    </div>
                </div>
            `).join('');
        }

        // এন্টার প্রেস করলে সার্চ ট্রিগার করার ইভেন্ট
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchRoot();
            }
        });

        // পেজ লোড হওয়ার সাথে সাথে ডেটা ফেচ করা
        loadDictionaryData();
    </script>
</body>
</html>
